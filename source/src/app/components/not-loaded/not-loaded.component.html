<div class="w-full h-full flex flex-col items-center justify-center gap-3 md:gap-6 text-sm md:text-base lg:text-lg">
  <h1 class="text-base md:text-lg lg:text-xl w-full px-10 md:px-0 md:w-2/5 text-center text-main font-semibold">
    {{ loaderErrorMsg }}
  </h1>
  <button
    onclick="location.reload()"
    id="btn-reload"
    class="hidden bg-blue-500 error-btn [&>*:first-child]:hover:rotate-[360deg]"
  >
    Recargar la pagina
    <i class="fa-solid fa-rotate-right duration-500"></i>
  </button>
  <button
    (click)="showPlayerModal()"
    id="btn-show_player_modal"
    class="hidden bg-blue-500 error-btn [&>*:first-child]:hover:rotate-180"
  >
    Añadir un jugador
    <i class="fa-solid fa-plus duration-500"></i>
  </button>
  <button
    (click)="showPaymentModal()"
    id="btn-show_payment_modal"
    class="hidden bg-green-500 error-btn [&>*:first-child]:hover:rotate-180"
  >
    Añadir un pago
    <i class="fa-solid fa-plus duration-500"></i>
  </button>
</div>
